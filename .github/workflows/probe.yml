# Manual check that GitHub-hosted runners can reach the UAlbany Schedule of
# Classes through Cloudflare and get correctly aligned, validated results.
name: Registrar access probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 --version
      - name: Spring 2027, graduate, CYBR
        run: python3 -m scraper --term "Spring 2027" --subject CYBR --level G --min-count 40
