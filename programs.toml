# Program requirements for the MS Cyber advising page.
#
# Edit this file to change what the page checks. Pushing a change to GitHub
# re-runs the data workflow, which validates this file and republishes the site.
#
# Course codes are written "SUBJ NNN". Requirements are filled in the order they
# appear in each program, so keep the catch-all electives last.
#
# Requirement types:
#   all    - every slot must be filled; a slot lists interchangeable courses.
#   choose - earn `credits` from `courses` (and, if set, any graduate course in
#            the `any_graduate` subjects).

[settings]
# Courses that count every time they are taken (different modules or topics,
# or thesis credits spread over terms). CYBR 678 is not repeatable: it counts
# once, so a student takes at most two internships, CYBR 678 and CYBR 578.
repeatable = ["CINF 523", "CYBR 699", "HHPM 669"]

# Sections whose course description contains one of these notes are not shown,
# because CEHC students cannot register for them.
hide_sections_noting = ["Graduate Business Students Only"]

# Order in which requirement labels are listed on the page. Every `label` and
# `course_labels` value below must appear here.
label_order = ["Core", "Optional Core", "Tools", "Elective", "Thesis or Internship", "Internship", "Thesis"]

# Short advising notes shown next to a course wherever the page lists it.
[settings.course_notes]
"CYBR 578" = "Internship with no credit minimum, open at any point in the program. Counts only as an elective, not toward the thesis or internship requirement."
"CYBR 627" = "Counts only as an elective, not toward the thesis or internship requirement."
"CYBR 678" = "Counts once, toward the thesis or internship requirement. With CYBR 578 as an elective, a student takes at most two internships."

# Courses from an earlier bulletin that still count if they are already on the
# transcript. The page never recommends them, and flags them for the advisor
# with this note. (Health core under the 2025-26 bulletin, confirmed October 2026.)
[settings.legacy_courses]
"HHPM 580" = "Health core under the 2025-26 bulletin, replaced by HEPI 514. Confirm with the advisor that it still counts for this student."
"HHPM 669" = "Health core under the 2025-26 bulletin, replaced by HSTA 601, and only with the Health Analytics topic. Confirm the topic and the credit with the advisor."

# Cross-listed codes for the same course (same title in the 2026-27 bulletin).
# A transcript line with the code on the left counts as the course on the right.
# Same number does not mean same course: CEHC 553, 554 and 555 are different courses.
[aliases]
"CEHC 545" = "CYBR 545"
"RPAD 545" = "CYBR 545"
"CEHC 547" = "CYBR 547"
"CEHC 549" = "CYBR 549"
"RPAD 549" = "CYBR 549"
"CEHC 550" = "CYBR 550"
"CEHC 569" = "CYBR 569"
"RPAD 569" = "CYBR 569"
"CINF 503" = "CYBR 503"
"CINF 552" = "CYBR 552"
"CINF 553" = "CYBR 553"
"CINF 554" = "CYBR 554"
"CINF 555" = "CYBR 555"

# Graduate courses that cannot be taken once the student has credit for one of
# the listed courses (usually the 400-level undergraduate version). Seeded from
# the 2026-27 course descriptions and the program sheets. The build adds any new
# rule it finds in current course descriptions.
#
# Rule applied on the page: a ruled-out course is never counted as taken. If it
# fills a required slot, the page notes that the student cannot take it and adds
# one more elective (3 credits) instead. In a "choose" list, the ruled-out course
# is noted and the student picks another course from the list. If the transcript
# has both courses, only the earlier one counts and the page flags the other.
#
# Pairs that block each other are listed both ways: the core alternatives
# (503/BFOR 525, 553/BCYB 644, 554/BCYB 645), CYBR 551/552 and CYBR 540/BFOR 615
# (confirmed October 2026).
[exclusions]
"CYBR 503" = ["CYBR 403", "BFOR 525"]
"BFOR 525" = ["CYBR 503"]
"CYBR 536" = ["CYBR 436"]
"CYBR 540" = ["CYBR 440", "BFOR 615"]
"CYBR 545" = ["CYBR 445", "CEHC 445"]
"CYBR 547" = ["CYBR 447"]
"CYBR 549" = ["CYBR 449", "CEHC 449", "RPAD 449"]
"CYBR 550" = ["CYBR 450"]
"CYBR 551" = ["CYBR 552"]
"CYBR 552" = ["CYBR 452", "CYBR 551"]
"CYBR 553" = ["CYBR 453", "BCYB 644"]
"BCYB 644" = ["CYBR 553"]
"CYBR 554" = ["CYBR 454", "BCYB 645"]
"BCYB 645" = ["CYBR 554"]
"CYBR 555" = ["CYBR 455"]
"CYBR 569" = ["CYBR 469", "CEHC 469", "RPAD 469"]
"CYBR 571" = ["CYBR 471"]
"BFOR 615" = ["BFOR 415", "CYBR 540"]


[[programs]]
id = "risk"
name = "Cyber Risk Management & Compliance"
degree = "MS in Cybersecurity and Risk"
source = "Graduate Bulletin 2026-27"
total_credits = 36
# Reserved-seat groups in the Schedule of Classes that this program's students belong to.
seat_groups = ["DFC-MS-RISKPCC students", "Cyber Risk Mgmt & Cmpl MS conc"]

  [[programs.requirements]]
  id = "core"
  label = "Core"
  name = "Core courses"
  type = "all"
  credits = 12
  slots = [
    ["CYBR 503", "BFOR 525"],
    ["CYBR 553", "BCYB 644"],
    ["CYBR 554", "BCYB 645"],
    ["CYBR 536"],
  ]

  [[programs.requirements]]
  id = "optional-core"
  label = "Optional Core"
  name = "Any three of five"
  type = "choose"
  credits = 9
  courses = ["CYBR 545", "CYBR 547", "CYBR 549", "CYBR 552", "CINF 585"]

  [[programs.requirements]]
  id = "tools"
  label = "Tools"
  name = "Cybersecurity tools course"
  type = "choose"
  credits = 3
  # CYBR 540 and CYBR 555 count here by a program change (confirmed October 2026).
  courses = ["CINF 523", "CYBR 540", "CYBR 555", "BFOR 615", "BFOR 642", "BFOR 643"]
  note = "CINF 523 is taken as three 1-credit modules, as advised."

  [[programs.requirements]]
  id = "capstone"
  label = "Thesis or Internship"
  name = "Thesis or internship project"
  type = "choose"
  credits = 3
  courses = ["CYBR 678", "CYBR 699"]
  course_labels = { "CYBR 678" = "Internship", "CYBR 699" = "Thesis" }
  note = "Only CYBR 678 or CYBR 699 fill this requirement. CYBR 578 and CYBR 627 count as electives."

  [[programs.requirements]]
  id = "electives"
  label = "Elective"
  name = "Electives"
  type = "choose"
  credits = 9
  any_graduate = ["CYBR"]
  courses = ["BCYB 602", "BFOR 650"]
  receives_replaced_credits = true
  note = "Any other CYBR graduate course, including CYBR 578 and CYBR 627. CYBR 699 can also count here with advisement. CYBR 678 counts only toward Thesis or Internship."


